<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>

  <!-- Solo root puede registrar el nombre del daemon en el bus del sistema -->
  <policy user="root">
    <allow own="es.rotativausb.Daemon"/>
  </policy>

  <!-- Cualquier usuario puede llamar a los métodos (polkit decide después) -->
  <policy context="default">
    <allow send_destination="es.rotativausb.Daemon"
           send_interface="es.rotativausb.Daemon1"/>
    <allow send_destination="es.rotativausb.Daemon"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="es.rotativausb.Daemon"
           send_interface="org.freedesktop.DBus.Properties"/>
  </policy>

</busconfig>
